<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f4f5;
      --surface-hover: #e9e9eb;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #ff0033;
      --accent-hover: #e0002d;
      --ok: #16a34a;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --surface: #27272a;
        --surface-hover: #323236;
        --border: #3f3f46;
        --text: #fafafa;
        --muted: #a1a1aa;
        --ok: #4ade80;
      }
    }

    * { box-sizing: border-box; }

    /* Altura fixa (limite do popup do Chrome é 600px): só a aba rola, e a
       área da scrollbar fica sempre reservada para o layout não pular */
    body {
      width: 400px;
      height: 580px;
      margin: 0;
      padding: 14px 14px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    h3 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
    p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }

    /* Cabeçalho com switch */
    .switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .switch-label { font-size: 15px; font-weight: 600; }
    .switch-status { font-size: 12px; color: var(--muted); }
    .switch-status::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
    }
    .switch-status.active { color: var(--ok); }
    .switch-status.inactive { color: var(--muted); }

    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: var(--border);
      border-radius: 22px;
      transition: background .2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
      transition: transform .2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Abas principais (segmented control) */
    .tabs {
      display: flex;
      padding: 3px;
      margin-bottom: 12px;
      background: var(--surface);
      border-radius: var(--radius);
    }
    .tab {
      flex: 1;
      padding: 6px 0;
      text-align: center;
      font-weight: 500;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background .15s, color .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .tab-content { display: none; }
    .tab-content.active {
      display: block;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-gutter: stable;
      margin-right: -8px;
      padding: 0 2px 14px 0;
    }

    /* Campos */
    #keywordList,
    .video-age-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    #keywordList { height: 72px; resize: none; display: block; }
    #keywordList:focus,
    .video-age-select:focus {
      border-color: var(--accent);
      background: var(--bg);
    }
    .video-age-select { height: 34px; }

    .row-container { display: flex; gap: 12px; margin: 12px 0; }
    .column-item { flex: 1; display: flex; flex-direction: column; }
    .column-item h3 { white-space: nowrap; }
    .column-item p { min-height: 17px; }

    /* Opções como lista de toggles */
    .options {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .options label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .options label + label { border-top: 1px solid var(--border); }
    .options label:hover { background: var(--surface); }
    .options input[type="checkbox"] {
      appearance: none;
      flex-shrink: 0;
      position: relative;
      width: 32px;
      height: 18px;
      margin: 0;
      background: var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: background .2s;
    }
    .options input[type="checkbox"]::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    .options input[type="checkbox"]:checked { background: var(--accent); }
    .options input[type="checkbox"]:checked::before { transform: translateX(14px); }
    .options input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Botão principal */
    #saveButton {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    #saveButton:hover { background: var(--accent-hover); }
    #saveButton:active { transform: scale(.98); }
    #saveButton.saved { background: var(--ok); }

    /* Estatísticas */
    .stats {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px;
      background: var(--surface);
      border-radius: var(--radius);
    }
    .stats p { margin: 0; }
    #totalHidden { font-size: 22px; font-weight: 700; color: var(--text); }

    .hidden-videos { margin-top: 12px; }
    .stats-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .stats-tab-btn {
      flex: 1;
      padding: 4px 0;
      white-space: nowrap;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .stats-tab-btn:hover { color: var(--text); background: var(--surface); }
    .stats-tab-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .stats-tab-content { display: none; }
    .stats-tab-content.active { display: block; }
    .stats-tab-content:empty::before {
      content: "Nenhum vídeo oculto nesta categoria";
      display: block;
      padding: 24px 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
    }
    .video-item:hover { background: var(--surface); }
    .video-thumbnail {
      width: 96px;
      height: 54px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 6px;
      background: var(--surface);
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-weight: 500;
      margin-bottom: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-date { font-size: 11px; color: var(--muted); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  </style>
</head>
<body>
  <!-- Switch para ligar/desligar a extensão -->
  <div class="switch-container">
    <div>
      <div class="switch-label">YT Smart Filter</div>
      <div id="switchStatus" class="switch-status">Carregando...</div>
    </div>
    <label class="switch" title="Ligar/desligar extensão">
      <input type="checkbox" id="extensionToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="keywords">Filtros</div>
    <div class="tab" data-tab="stats">Estatísticas</div>
  </div>

  <div id="keywords-tab" class="tab-content active">
    <h3>Palavras-chave para ocultar</h3>
    <p>Uma palavra por linha</p>
    <textarea id="keywordList" placeholder="esquerda&#10;playstation&#10;godot"></textarea>
    <div class="row-container">
      <div class="column-item">
        <h3>Ocultar por idade</h3>
        <p>Mais antigos que</p>
        <select id="videoAge" class="video-age-select">
          <option value="0">Não ocultar</option>
          <option value="1">1 ano</option>
          <option value="2">2 anos</option>
          <option value="3" selected>3 anos</option>
          <option value="5">5 anos</option>
          <option value="10">10 anos</option>
        </select>
      </div>

      <div class="column-item">
        <h3>Limite por canal</h3>
        <p>Máx. de vídeos (0 desativa)</p>
        <input type="number" id="channelLimit" class="video-age-select" min="0" value="2">
      </div>
    </div>

    <div class="options">
      <label>Ocultar vídeos já assistidos <input type="checkbox" id="hideWatched" checked></label>
      <label>Ocultar playlists e coleções <input type="checkbox" id="hidePlaylists" checked></label>
      <label>Ocultar "Descoberta avançada de novos temas" <input type="checkbox" id="hideAdvancedDiscovery" checked></label>
      <label>Ocultar vídeos repetidos <input type="checkbox" id="hideDuplicates" checked></label>
      <label>Alt+Click marca "Não tenho interesse" <input type="checkbox" id="enableAltClick" checked></label>
    </div>

    <button id="saveButton">Salvar</button>
  </div>

  <div id="stats-tab" class="tab-content">
    <div class="stats">
      <p>Total de vídeos ocultos</p>
      <span id="totalHidden">0</span>
    </div>
    <div class="hidden-videos">
      <div class="stats-tabs">
        <button class="stats-tab-btn active" data-stats-tab="keyword">Palavra</button>
        <button class="stats-tab-btn" data-stats-tab="date">Idade</button>
        <button class="stats-tab-btn" data-stats-tab="watched">Assistido</button>
        <button class="stats-tab-btn" data-stats-tab="channelLimit">Canal</button>
        <button class="stats-tab-btn" data-stats-tab="playlist">Playlist</button>
      </div>
      <div id="hiddenVideosList-keyword" class="hiddenVideosList stats-tab-content active"></div>
      <div id="hiddenVideosList-date" class="hiddenVideosList stats-tab-content"></div>
      <div id="hiddenVideosList-watched" class="hiddenVideosList stats-tab-content"></div>
      <div id="hiddenVideosList-channelLimit" class="hiddenVideosList stats-tab-content"></div>
      <div id="hiddenVideosList-playlist" class="hiddenVideosList stats-tab-content"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
